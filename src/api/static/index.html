<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Organizer - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pdf-viewer { width: 100%; height: 80vh; border: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="flex h-screen w-full overflow-hidden">
        
        <!-- Sidebar (Resizable) -->
        <div id="main-sidebar" class="bg-gray-50 overflow-y-auto flex-shrink-0 flex flex-col relative group" style="width: 288px; min-width: 200px; max-width: 50vw;">
            <div class="p-4 bg-blue-600 text-white font-bold text-lg">
                File Organizer
            </div>
            <div class="p-4 border-b">
                <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">Areas</h2>
                <div id="house-list" class="space-y-1 overflow-y-auto">
                    <p class="text-gray-400 text-sm">Loading...</p>
                </div>
            </div>
        </div>
        
        <!-- Resizer 1 -->
        <div id="resizer-1" class="w-1.5 cursor-col-resize hover:bg-blue-400 bg-gray-200 z-10 transition-colors flex-shrink-0"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col bg-gray-50 h-screen overflow-hidden">
            
            <!-- Combined Header Bar: title left, search right -->
            <header id="top-navbar" class="bg-white p-3 border-b shadow-sm flex items-center justify-between z-20 flex-shrink-0 gap-4">
                <div class="flex items-center gap-3 min-w-0">
                    <h1 id="current-house-title" class="text-xl font-semibold truncate">Select an Area</h1>
                    <div id="stats-badge" class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded hidden flex-shrink-0"></div>
                </div>
                <div class="relative flex-shrink-0 w-64">
                    <input id="search-input" type="search" placeholder="Search tenants or houses..." 
                           class="w-full px-3 py-1.5 rounded-md border border-gray-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50 text-gray-900 placeholder-gray-400 transition-colors" autocomplete="off" />
                    
                    <div id="search-results" class="hidden absolute top-full right-0 mt-2 bg-white border rounded-md shadow-xl overflow-hidden max-h-96 overflow-y-auto" style="width: 360px;">
                        <!-- Results will be injected here -->
                    </div>
                </div>
            </header>

            <!-- Dashboard / Viewer Area -->
            <main class="flex-1 overflow-hidden flex">
                <!-- Left panel: Documents List -->
                <div id="document-list-panel" class="bg-white overflow-y-auto hidden flex-col flex-shrink-0" style="width: 33%; min-width: 250px; max-width: 60vw;">
                    <!-- Tabs -->
                    <div class="flex border-b bg-gray-50">
                        <button id="tab-categories" class="flex-1 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600">Categories</button>
                        <button id="tab-timeline" class="flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">Timeline</button>
                    </div>
                    
                    <div id="document-list" class="p-2 space-y-2"></div>
                </div>
                
                <!-- Resizer 2 -->
                <div id="resizer-2" class="w-1.5 cursor-col-resize hover:bg-blue-400 bg-gray-200 z-10 transition-colors hidden flex-shrink-0"></div>

                <!-- Right panel: Document Viewer -->
                <div id="document-viewer-panel" class="flex-1 p-6 bg-gray-100 flex-col items-center justify-center hidden overflow-hidden">
                    <div class="bg-white rounded-lg shadow-lg w-full max-w-4xl overflow-hidden flex flex-col h-full">
                        <div class="p-3 bg-gray-800 text-white flex justify-between items-center">
                            <span id="viewer-title" class="font-medium truncate">Document</span>
                            <a id="viewer-download" href="#" target="_blank" class="text-sm hover:text-blue-300">Open in New Tab</a>
                        </div>
                        <iframe id="pdf-frame" class="pdf-viewer"></iframe>
                    </div>
                </div>
                
                <!-- Placeholder when no house is selected -->
                <div id="welcome-panel" class="flex-1 flex items-center justify-center">
                    <div class="text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <h3 class="mt-2 text-sm font-medium text-gray-900">No area selected</h3>
                        <p class="mt-1 text-sm text-gray-500">Select a tenant or house from the sidebar to view documents.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // API Base URL
        const API_HOURSES_BASE = '/api/houses';
        const API_TREE = '/api/tree';
        let currentArea = null;
        let currentHouse = null;
        let currentTenant = null;

        // Elements
        const houseListEl = document.getElementById('house-list');
        const currentHouseTitle = document.getElementById('current-house-title');
        const statsBadge = document.getElementById('stats-badge');
        
        const tabTimeline = document.getElementById('tab-timeline');
        const tabCategories = document.getElementById('tab-categories');
        let currentTab = 'timeline';
        let currentCategories = [];
        
        const docListPanel = document.getElementById('document-list-panel');
        const docViewerPanel = document.getElementById('document-viewer-panel');
        const welcomePanel = document.getElementById('welcome-panel');
        const docListEl = document.getElementById('document-list');
        
        const pdfFrame = document.getElementById('pdf-frame');
        const viewerTitle = document.getElementById('viewer-title');
        const viewerDownload = document.getElementById('viewer-download');

        // State
        let currentTimeline = [];

        async function loadTree() {
            try {
                const res = await fetch(API_TREE);
                if (!res.ok) throw new Error('Failed to load tree');
                const treeData = await res.json();
                
                houseListEl.innerHTML = '';
                if (treeData.length === 0) {
                    houseListEl.innerHTML = '<p class="text-gray-400 text-sm">No areas found.</p>';
                    return;
                }
                
                const ul = document.createElement('ul');
                ul.className = 'pl-2 space-y-1';
                createTreeNodes(treeData, ul, '', '');
                houseListEl.appendChild(ul);

                // Check hash on load
                handleHashChange();
            } catch (err) {
                houseListEl.innerHTML = '<p class="text-red-400 text-sm">Error loading data.</p>';
            }
        }

        function createTreeNodes(nodes, parentEl, parentPath, parentArea) {
            nodes.forEach(node => {
                const li = document.createElement('li');
                const currentPath = parentPath ? `${parentPath}/${node.type}/${node.id}` : `/${node.type}/${node.id}`;
                li.dataset.path = currentPath;
                li.className = 'tree-node';

                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-2 py-1 rounded text-sm text-gray-700 hover:bg-blue-50 focus:outline-none flex items-center tree-item';
                
                const icon = document.createElement('span');
                icon.className = 'mr-2 text-gray-400 inline-block w-4 text-center flex-shrink-0';
                icon.innerHTML = (node.children && node.children.length > 0) ? '▶' : '•';
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'flex items-center justify-between w-full overflow-hidden';
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = node.name;
                nameSpan.className = 'truncate text-left';
                contentDiv.appendChild(nameSpan);

                if (node.subtitle) {
                    const subSpan = document.createElement('span');
                    subSpan.textContent = node.subtitle;
                    if (node.is_long_term) {
                        subSpan.className = 'text-[9px] leading-none text-red-700 bg-red-50 border-[1.5px] border-red-400 px-1 py-[2px] rounded-sm ml-1 flex-shrink-0 font-medium';
                    } else {
                        subSpan.className = 'text-[9px] leading-none text-gray-500 bg-white border border-gray-200 px-1 py-[2px] rounded-sm ml-1 flex-shrink-0';
                    }
                    contentDiv.appendChild(subSpan);
                }

                btn.appendChild(icon);
                btn.appendChild(contentDiv);
                li.appendChild(btn);

                let childrenContainer = null;
                if (node.children && node.children.length > 0) {
                    childrenContainer = document.createElement('ul');
                    childrenContainer.className = 'pl-4 hidden space-y-1 mt-1';
                    createTreeNodes(node.children, childrenContainer, currentPath, node.type === 'area' ? node.name : parentArea);
                    li.appendChild(childrenContainer);

                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const isHidden = childrenContainer.classList.contains('hidden');
                        if (isHidden) {
                            childrenContainer.classList.remove('hidden');
                            icon.innerHTML = '▼';
                        } else {
                            childrenContainer.classList.add('hidden');
                            icon.innerHTML = '▶';
                        }
                        // Also load timeline if this is a house node
                        if (node.type === 'house' && parentArea) {
                            window.location.hash = currentPath;
                        }
                    };
                }

                if (node.type === 'tenant') {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        window.location.hash = currentPath;
                    };
                } else if (node.type === 'house' && (!node.children || node.children.length === 0)) {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        window.location.hash = currentPath;
                    };
                }

                parentEl.appendChild(li);
            });
        }

        function handleHashChange() {
            console.log("HASH CHANGE", window.location.hash);
            const hash = decodeURIComponent(window.location.hash.replace('#', ''));
            if (!hash) return;

            // Always parse area + house from the hash first
            // hash format: /area/area_id/house/house_id[/tenant/tenant_id]
            const parts = hash.split('/');
            let areaId = null, houseId = null, tenantId = null;
            for (let i = 0; i < parts.length; i++) {
                if (parts[i] === 'area' && i + 1 < parts.length) areaId = decodeURIComponent(parts[i+1]).replace(/^area_/, '');
                if (parts[i] === 'house' && i + 1 < parts.length) houseId = decodeURIComponent(parts[i+1]);
                if (parts[i] === 'tenant' && i + 1 < parts.length) tenantId = decodeURIComponent(parts[i+1]);
            }

            let tenantName = null;
            if (tenantId && houseId && tenantId.startsWith(houseId + '_')) {
                tenantName = tenantId.substring(houseId.length + 1);
            }

            // Auto-switch to categories when a specific person/tenant is clicked
            if (tenantName && currentTab !== 'categories') {
                currentTab = 'categories';
                tabCategories.className = "flex-1 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600";
                tabTimeline.className = "flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700";
            }

            // Load data whenever we have area + house
            if (areaId && houseId) {
                selectHouse(areaId, houseId, tenantName);
            }

            // Clear previous selections
            document.querySelectorAll('.tree-item').forEach(el => {
                el.classList.remove('bg-blue-100', 'text-blue-800', 'font-medium');
            });

            // Highlight matching node and expand its parents if found in tree
            const targetLi = document.querySelector(`li[data-path="${hash}"]`);
            if (targetLi) {
                const btn = targetLi.querySelector('.tree-item');
                if (btn) btn.classList.add('bg-blue-100', 'text-blue-800', 'font-medium');

                // Expand parents
                let current = targetLi.parentElement;
                while (current && current.id !== 'house-list') {
                    if (current.tagName === 'UL') {
                        current.classList.remove('hidden');
                        const parentLi = current.parentElement;
                        if (parentLi && parentLi.tagName === 'LI') {
                            const icon = parentLi.querySelector('.tree-item span');
                            if (icon) icon.innerHTML = '▼';
                        }
                    }
                    current = current.parentElement;
                }
                targetLi.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        window.addEventListener('hashchange', handleHashChange);

        async function selectHouse(areaId, houseId, tenantName) {
            currentArea = areaId;
            currentHouse = houseId;
            currentTenant = tenantName; // Will be null if no tenant selected
            currentHouseTitle.textContent = tenantName ? `${houseId} - ${tenantName}` : houseId;

            welcomePanel.classList.add('hidden');
            docListPanel.classList.remove('hidden');
            document.getElementById('resizer-2').classList.remove('hidden');
            docListPanel.classList.add('flex');
            docViewerPanel.classList.add('hidden'); // hide until a doc is selected

            await refreshCurrentTab(areaId, houseId);
        }
        
        async function refreshCurrentTab(areaId, houseId) {
            if (currentTab === 'timeline') {
                await loadTimeline(areaId, houseId);
            } else {
                await loadCategories(areaId, houseId);
            }
        }

        async function loadTimeline(areaId, houseId) {
            docListEl.innerHTML = '<p class="text-sm text-gray-500 p-2">Loading documents...</p>';
            try {
                const res = await fetch(`/api/areas/${encodeURIComponent(areaId)}/houses/${encodeURIComponent(houseId)}/timeline`);
                if (!res.ok) throw new Error('Failed to load timeline');
                currentTimeline = await res.json();
                
                statsBadge.textContent = `${currentTimeline.length} Documents`;
                statsBadge.classList.remove('hidden');
                
                renderTimeline();
            } catch (err) {
                docListEl.innerHTML = '<p class="text-sm text-red-500 p-2">Error loading timeline.</p>';
            }
        }

        function renderTimeline() {
            docListEl.innerHTML = '';
            
            let displayTimeline = currentTimeline;
            
            if (displayTimeline.length === 0) {
                docListEl.innerHTML = '<p class="text-sm text-gray-500 p-2">No documents found for this selection.</p>';
                return;
            }
            
            displayTimeline.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'p-3 border rounded-md cursor-pointer hover:border-blue-400 hover:shadow-sm bg-white transition-all';
                
                const title = doc.brief_arabic_title || 'Untitled Document';
                const date = (doc.dates && doc.dates.length > 0) ? doc.dates[0] : 'Unknown Date';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h4 class="text-sm font-semibold text-gray-800 line-clamp-2">${title}</h4>
                    </div>
                    <div class="mt-2 flex items-center justify-between text-xs text-gray-500">
                        <span>${date}</span>
                        <span class="bg-gray-100 px-2 py-0.5 rounded">${doc.primary_tenant || 'No Tenant'}</span>
                    </div>
                `;
                
                card.onclick = () => openDocument(doc.vault_id, title);
                docListEl.appendChild(card);
            });
        }

        async function loadCategories(areaId, houseId) {
            console.log('loadCategories called', areaId, houseId);
            docListEl.innerHTML = '<p class="text-sm text-gray-500 p-2">Loading categories...</p>';
            try {
                const res = await fetch(`/api/areas/${encodeURIComponent(areaId)}/houses/${encodeURIComponent(houseId)}/categories`);
                if (!res.ok) throw new Error('Failed to load categories');
                currentCategories = await res.json();
                
                // For categories, total sum of documents
                const totalDocs = currentCategories.reduce((sum, cat) => sum + cat.document_count, 0);
                statsBadge.textContent = `${currentCategories.length} Categories (${totalDocs} Docs)`;
                statsBadge.classList.remove('hidden');
                
                renderCategories();
            } catch (err) {
                console.error(err);
                docListEl.innerHTML = '<p class="text-sm text-red-500 p-2">Error loading categories.</p>';
            }
        }

        function renderCategories() {
            docListEl.innerHTML = '';
            
            let displayCategories = [];
            
            if (currentTenant) {
                // Show categories for this tenant
                displayCategories = currentCategories.filter(cat => cat.tenant === currentTenant);
            } else {
                // If house level, aggregate categories by name across all tenants
                const agg = {};
                currentCategories.forEach(cat => {
                    if (!agg[cat.name]) {
                        agg[cat.name] = { count: 0, documents: [] };
                    }
                    agg[cat.name].count += cat.document_count;
                    if (cat.documents) {
                        agg[cat.name].documents = agg[cat.name].documents.concat(cat.documents);
                    }
                });
                for (const [name, data] of Object.entries(agg)) {
                    displayCategories.push({ name: name, document_count: data.count, documents: data.documents });
                }
            }
            
            // Unconditionally sort by name, using natural numeric sorting (e.g. 2 comes before 10)
            displayCategories.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            
            if (displayCategories.length === 0) {
                docListEl.innerHTML = '<p class="text-sm text-gray-500 p-2">No categories found for this selection.</p>';
                return;
            }
            
            displayCategories.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'p-3 border rounded-md bg-white mb-2 cursor-pointer hover:bg-gray-50';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h4 class="text-sm font-semibold text-gray-800">${cat.name}</h4>
                    </div>
                    <div class="mt-2 flex items-center justify-between text-xs text-gray-500">
                        <span class="bg-gray-100 px-2 py-0.5 rounded">${cat.document_count} Documents</span>
                    </div>
                    <div class="category-docs hidden mt-3 pt-3 border-t">
                    </div>
                `;
                
                if (cat.documents && cat.documents.length > 0) {
                    const docsContainer = card.querySelector('.category-docs');
                    cat.documents.forEach(doc => {
                        const docEl = document.createElement('div');
                        docEl.className = 'text-sm text-blue-600 hover:underline cursor-pointer py-1 ml-2';
                        const title = doc.brief_arabic_title || doc.filename || 'Document';
                        docEl.textContent = title;
                        docEl.onclick = (e) => {
                            e.stopPropagation();
                            openDocument(doc.vault_id, title);
                        };
                        docsContainer.appendChild(docEl);
                    });
                }
                
                card.onclick = () => {
                    const docsContainer = card.querySelector('.category-docs');
                    if (docsContainer) {
                        docsContainer.classList.toggle('hidden');
                    }
                };
                docListEl.appendChild(card);
            });
        }

        function openDocument(vaultId, title) {
            docViewerPanel.classList.remove('hidden');
            docViewerPanel.classList.add('flex');
            
            viewerTitle.textContent = title;
            const pdfUrl = `/api/areas/${encodeURIComponent(currentArea)}/houses/${encodeURIComponent(currentHouse)}/pdf/${vaultId}`;
            // Append #view=FitH to make the PDF fit the iframe width rather than zooming in
            pdfFrame.src = pdfUrl + '#view=FitH';
            viewerDownload.href = pdfUrl;
        }

        // Search functionality
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');

        let searchTimeout = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const q = searchInput.value.trim();
            if (!q) {
                searchResults.classList.add('hidden');
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                try {
                    searchResults.innerHTML = '<div class="p-4 text-center text-gray-500">Searching...</div>';
                    searchResults.classList.remove('hidden');
                    
                    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
                    if (!res.ok) throw new Error('Search failed');
                    const results = await res.json();
                    
                    if (results.length === 0) {
                        searchResults.innerHTML = '<div class="p-4 text-center text-gray-500">No results</div>';
                        return;
                    }
                    
                    searchResults.innerHTML = '';
                    const ul = document.createElement('ul');
                    ul.className = 'divide-y divide-gray-100';
                    
                    results.forEach(item => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = item.url;
                        a.className = 'block p-3 hover:bg-blue-50 transition-colors';
                        a.innerHTML = `
                            <div class="font-medium text-gray-900">${item.title}</div>
                            <div class="text-xs text-gray-500 mt-1">${item.subtitle}</div>
                        `;
                        a.onclick = () => {
                            searchResults.classList.add('hidden');
                        };
                        li.appendChild(a);
                        ul.appendChild(li);
                    });
                    
                    searchResults.appendChild(ul);
                } catch (err) {
                    searchResults.innerHTML = '<div class="p-4 text-center text-red-500">Search error</div>';
                }
            }, 250);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchResults.classList.add('hidden');
                searchInput.blur();
                return;
            }
            if (e.key === 'Enter') {
                e.preventDefault();
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });


        // Tab switching
        tabTimeline.addEventListener('click', () => {
            console.log('Timeline clicked');
            if (currentTab === 'timeline') return;
            currentTab = 'timeline';
            
            tabTimeline.className = "flex-1 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600";
            tabCategories.className = "flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700";
            
            if (currentArea && currentHouse) {
                refreshCurrentTab(currentArea, currentHouse);
            }
        });

        tabCategories.addEventListener('click', () => {
            console.log('Categories clicked', currentArea, currentHouse);
            if (currentTab === 'categories') return;
            currentTab = 'categories';
            
            tabCategories.className = "flex-1 py-2 text-sm font-medium border-b-2 border-blue-600 text-blue-600";
            tabTimeline.className = "flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700";
            
            if (currentArea && currentHouse) {
                refreshCurrentTab(currentArea, currentHouse);
            }
        });
        
        // Resizer Logic
        function setupResizer(resizerId, panelId, isPercentage = false) {
            const resizer = document.getElementById(resizerId);
            const panel = document.getElementById(panelId);
            let isResizing = false;
            let startX;
            let startWidth;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = panel.getBoundingClientRect().width;
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none'; // Prevent text selection
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const deltaX = e.clientX - startX;
                let newWidth = startWidth + deltaX;
                
                if (isPercentage) {
                    const parentWidth = panel.parentElement.getBoundingClientRect().width;
                    let percentage = (newWidth / parentWidth) * 100;
                    // Clamp to min 20% and max 60%
                    percentage = Math.max(20, Math.min(percentage, 60));
                    panel.style.width = `${percentage}%`;
                } else {
                    // Clamp for pixel values
                    newWidth = Math.max(200, Math.min(newWidth, window.innerWidth * 0.5));
                    panel.style.width = `${newWidth}px`;
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    document.body.style.userSelect = '';
                }
            });
        }

        setupResizer('resizer-1', 'main-sidebar', false);
        setupResizer('resizer-2', 'document-list-panel', true);

        // Init
        loadTree();

    </script>
</body>
</html>
